<style>
:root{--bg:#DFE6E1;--card:#FFFFFF;--ink:#13201C;--soft:#56645E;--line:#C5CFC9;--red:#CF2E2B;--blue:#2445A2;--gold:#EFAE2A;--green:#1C7A4E;
 --field:#FFFFFF;--sunk:#F2F5F3;--track:#E8EDEA;--t-green:#E6F4EC;--t-red:#FCEDEC;--t-gold:#FFF5DD;--t-gold-line:#F3D48A;--t-blue:#EEF2FB;
 --hero:#13201C;--hero-fg:#FFFFFF;--hero-soft:#C9D3CE;--on-blue:#FFFFFF;--r:18px;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1512;--card:#16211D;--ink:#E6EEE9;--soft:#98A9A1;--line:#2B3934;--red:#E5534B;--blue:#86A3F4;--gold:#F2B233;--green:#45C387;
 --field:#1B2823;--sunk:#1F2C27;--track:#26342E;--t-green:#143327;--t-red:#3A1D1C;--t-gold:#352C15;--t-gold-line:#6B5720;--t-blue:#1A2442;
 --hero:#1D2A25;--hero-fg:#F1F5F3;--hero-soft:#A9B8B1;--on-blue:#0E1512;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;line-height:1.5;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:640px;margin:0 auto;padding:14px 14px 40px}
.pl{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.serif{font-family:'Newsreader',Georgia,serif}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* home */
.hero{padding:12px 2px 8px}
.brand{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.brand span{color:var(--red)}
.brand.sm{font-size:30px;margin-bottom:10px}
.sub{color:var(--soft);font-size:14px;margin-top:4px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pill{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600}
.pill.good{border-color:var(--green);color:var(--green)}
.pill.bad{border-color:var(--red);color:var(--red)}
.today{background:var(--hero);color:var(--hero-fg);border-radius:var(--r);padding:18px;margin:12px 0}
.today .tnum{font-size:18px}
.today .tnum b{font-size:30px;color:var(--gold);margin-right:4px}
.today .note{color:var(--hero-soft)}
.linkish{background:none;border:0;color:var(--hero-soft);text-decoration:underline;font-size:13px;margin-top:10px;cursor:pointer;padding:6px 0}
.go{background:var(--red);color:#fff;border:0;border-radius:14px;padding:14px 18px;font-size:17px;font-weight:800;cursor:pointer;width:100%;margin-top:12px}
.go.big{font-size:19px;padding:16px}
.go.alt{background:var(--blue);color:var(--on-blue)}
.go:disabled{opacity:.5}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px;font-weight:600;cursor:pointer}
.ghost.danger{color:var(--red);border-color:var(--red)}
.panel{background:var(--card);border-radius:var(--r);padding:14px;margin:12px 0;border:1.5px solid var(--line)}
.panel h3{margin:0 0 8px;font-size:18px}
.panel h4{margin:16px 0 6px;font-size:14px;color:var(--soft)}
.panel.tip{background:var(--t-gold);border-color:var(--t-gold-line);font-size:14px}
.panel.intro ol{margin:6px 0 0;padding-left:20px;font-family:'Newsreader',Georgia,serif;font-size:16px}
.panel.intro li{margin:4px 0}
.crow{margin:6px 0 10px}
.clabel{font-size:12px;font-weight:700;color:var(--soft);margin-bottom:5px;letter-spacing:.03em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--field);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-weight:700}
table.mem{width:100%;border-collapse:collapse;font-size:13px}
table.mem th{text-align:left;width:70px;font-weight:700}
table.mem td{padding:3px 4px;vertical-align:middle}
table.mem td:nth-child(2){color:var(--soft);width:60px}
table.mem td:last-child{display:flex;align-items:center;gap:8px}
table.mem td:last-child span{white-space:nowrap;color:var(--soft);font-size:12px}
.mbar{flex:1;height:9px;background:var(--track);border-radius:9px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--green);border-radius:9px}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.tier{background:var(--sunk);border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--soft)}
.tier b{font-size:20px;color:var(--ink)}
.fcast{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;height:100px}
.fc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:11px;color:var(--soft);height:100%}
.fc i{display:block;width:70%;background:var(--blue);border-radius:6px 6px 2px 2px;min-height:2px}
.fc b{color:var(--ink);font-size:12px}
.hard div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.hard div span:last-child{color:var(--soft);font-size:12px}
details.panel summary{cursor:pointer;font-weight:700;font-size:15px}
.sci .prin{border-top:1px solid var(--line);padding:10px 0}
.sci .prin p{margin:3px 0;font-family:'Newsreader',Georgia,serif;font-size:16px}
.sci .prin small{color:var(--soft);font-size:12px}
.bk{width:100%;font-family:ui-monospace,monospace;font-size:11px;border:1.5px solid var(--line);border-radius:10px;padding:8px;margin:8px 0;background:var(--field);color:var(--ink)}
.search{width:100%;font-size:16px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);margin:4px 0 8px;font-family:inherit;background:var(--field);color:var(--ink)}
.blist{max-height:420px;overflow:auto;border-top:1px solid var(--line)}
.brow{display:grid;grid-template-columns:14px 1fr 1fr 44px;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px dashed var(--line);padding:8px 2px;font-size:14px;cursor:pointer}
.brow .serif{color:var(--soft);font-size:15px}
.brow .bs{font-size:12px;color:var(--soft);text-align:right}
.dot{width:10px;height:10px;border-radius:50%;display:block}
.dot.g{background:var(--green)}.dot.y{background:var(--gold)}.dot.r{background:var(--red)}.dot.n{background:var(--line)}
.note{font-size:13px;color:var(--soft);margin-top:8px}
footer{font-size:11px;color:var(--soft);text-align:center;margin-top:18px}
/* session */
.sbar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--soft);margin-bottom:10px;flex-wrap:wrap}
.sbar #clock{font-weight:800;color:var(--ink);font-size:14px;min-width:42px}
.sbar .xp{font-weight:800;color:var(--ink)}
.lvl{display:inline-flex;gap:3px}
.lvl i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.lvl i.on{background:var(--gold)}
.endb{margin-left:auto;background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px;cursor:pointer}
.trial{background:var(--card);border-radius:var(--r);padding:18px 16px;border:1.5px solid var(--line);min-height:300px}
.phase{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.hint{font-size:14px;color:var(--soft);margin:4px 0 10px}
.hint.good{color:var(--green);font-weight:700}
.big{font-size:32px;font-weight:800;line-height:1.2;margin:4px 0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.big.serif{font-weight:600;font-size:28px}
.mean{font-size:24px;margin:-6px 0 6px}
.cue{background:var(--t-gold);border-radius:12px;padding:9px 12px;font-size:14px;margin:12px 0 0}
.spk{border:0;background:var(--blue);color:var(--on-blue);width:34px;height:34px;border-radius:50%;font-size:13px;cursor:pointer;flex:none}
.play{border:0;background:var(--blue);color:var(--on-blue);border-radius:14px;padding:16px 20px;font-size:18px;font-weight:800;cursor:pointer;margin:6px 0 14px}
.pic{display:flex;justify-content:center;align-items:center;min-height:80px;margin:2px 0 6px}
.pic .emo .tw svg{width:72px;height:72px}
.pic.big .emo .tw svg{width:104px;height:104px}
.pic img.ara{width:110px;height:110px;object-fit:contain;background:#fff;border-radius:14px;padding:4px}
.pic.big img.ara{width:150px;height:150px}
.emo{display:inline-flex;gap:4px;font-size:56px;line-height:1}
.emo.sm .tw svg{width:26px;height:26px}
.emo .tw svg{display:block}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--field);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:17px;cursor:pointer;display:flex;gap:10px;align-items:center;font-family:'Newsreader',Georgia,serif}
.opt.pl{font-family:'Bricolage Grotesque',sans-serif;font-weight:600}
.opt .k{font-family:'Bricolage Grotesque',sans-serif;font-size:11px;color:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.opt.right{border-color:var(--green);background:var(--t-green)}
.opt.wrong{border-color:var(--red);background:var(--t-red)}
.qtext{font-size:19px;font-weight:600;margin-bottom:12px;font-family:'Newsreader',Georgia,serif}
.qtext.pl{font-family:'Bricolage Grotesque',sans-serif;font-weight:700}
input.ans{width:100%;font-size:22px;padding:13px 14px;border-radius:14px;border:2px solid var(--line);font-family:'Bricolage Grotesque',sans-serif;background:var(--field);color:var(--ink)}
input.ans:focus{border-color:var(--ink);outline:none}
.pk{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.pk button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);font-size:17px;cursor:pointer}
.btns{display:grid;grid-template-columns:auto 1fr 1.2fr;gap:6px;margin-top:6px}
.btns .go{margin-top:0}
.built{min-height:54px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.built .ph{color:var(--soft);font-size:14px}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.tok{background:var(--field);border:1.5px solid var(--ink);border-radius:10px;padding:9px 12px;font-size:18px;font-weight:600;cursor:pointer}
.tok.on{background:var(--ink);color:var(--bg)}
.gname{font-size:24px;font-weight:800;margin-bottom:8px}
.worked .rule,.fb .rule{background:var(--t-blue);border-left:4px solid var(--blue);border-radius:0 10px 10px 0;padding:9px 12px;font-size:15px;margin:8px 0}
.rule b{color:var(--blue)}
.wx{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:17px}
.wx .wlab{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
.wx table td{padding:2px 12px 2px 0}
.wx b{color:var(--red)}
.wx .why{font-size:14px;color:var(--soft);margin-top:4px;font-family:'Newsreader',Georgia,serif}
.gword{font-size:30px;font-weight:800;line-height:1.35;text-align:center;margin:10px 0 18px;display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline}
.gword .pron{color:var(--soft);font-weight:600;font-size:20px}
.slot{min-width:1.7em;border-bottom:3px solid var(--red);color:var(--red);padding:0 3px;cursor:pointer;text-align:center}
.slot.full{color:var(--blue);border-bottom-color:var(--blue)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiles.whole{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--field);border:1.5px solid var(--ink);border-radius:12px;padding:14px 2px;font-size:19px;font-weight:700;cursor:pointer}
.tile:active,.tok:active,.opt:active{transform:translateY(1px)}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;border:2px solid}
.fb.ok{border-color:var(--green);background:var(--t-green)}
.fb.meh{border-color:var(--gold);background:var(--t-gold)}
.fb.no{border-color:var(--red);background:var(--t-red)}
.fbh{font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.xpc{font-size:13px;color:var(--soft);font-weight:700}
.fbans{font-size:24px;font-weight:800;margin:6px 0 2px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fbans b{color:var(--red)}
.fbmean{font-size:17px}
.diff{font-size:17px;margin:8px 0;background:var(--field);border-radius:10px;padding:8px 10px}
.diff span{display:inline-block;width:62px;font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em}
.diff s{color:var(--red);text-decoration:line-through}
.diff u{color:var(--green);text-decoration:none;background:var(--t-green);border-radius:3px;padding:0 1px}
.contrast{font-size:14px;margin:6px 0}
.contrast b{color:var(--red)}
.hyper{background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 11px;font-size:14px;margin:8px 0}
.summary{background:var(--card);border-radius:var(--r);padding:18px;border:1.5px solid var(--line)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 10px}
.sgrid div{background:var(--sunk);border-radius:12px;padding:10px 4px;text-align:center;display:flex;flex-direction:column}
.sgrid b{font-size:22px}
.sgrid span{font-size:11px;color:var(--soft)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:9;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const FW=[0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
const DECAY=-0.5, FACTOR=19/81;
const clampD=d=>Math.min(10,Math.max(1,d));
const retr=(tDays,S)=>Math.pow(1+FACTOR*Math.max(0,tDays)/S,DECAY);
const ivlFor=(S,r)=>S/FACTOR*(Math.pow(r,1/DECAY)-1);
const D0=g=>clampD(FW[4]-(g-3)*FW[5]);
const S0=g=>FW[g-1];
const nextD=(D,g)=>clampD(FW[7]*D0(3)+(1-FW[7])*(D-FW[6]*(g-3)));
const sRecall=(D,S,r,g)=>S*(Math.exp(FW[8])*(11-D)*Math.pow(S,-FW[9])*(Math.exp(FW[10]*(1-r))-1)*(g===2?FW[15]:1)*(g===4?FW[16]:1)+1);
const sForget=(D,S,r)=>Math.min(S,FW[11]*Math.pow(D,-FW[12])*(Math.pow(S+1,FW[13])-1)*Math.exp(FW[14]*(1-r)));
function schedule(c,t){
  let iv=ivlFor(c.s,ST.settings.ret);
  if(iv>2.5) iv*=1+(Math.random()-0.5)*0.1;           /* small fuzz so reviews do not clump */
  c.due=dayIndex(t)+Math.max(1,Math.round(iv));
}
function fsrsInit(id,g,t){ const c={s:S0(g),d:D0(g),last:t,reps:1,lapses:g===1?1:0}; schedule(c,t); ST.cards[id]=c; return c; }
function fsrsReview(c,g,t){
  const r=retr((t-c.last)/DAY,c.s);
  c.s = g===1 ? sForget(c.d,c.s,r) : sRecall(c.d,c.s,r,g);
  c.d = nextD(c.d,g); c.last=t; c.reps++; if(g===1) c.lapses++;
  schedule(c,t); return r;
}

const ITEMS=[], BYID={};
function canon(p){                                  /* one speakable Polish string */
  let s=p.replace(/\s*\([^)]*\)/g,'').trim();
  if(/ \/ /.test(s)){
    const parts=s.split(' / ');
    if(parts.every(x=>/^[A-ZĄĆĘŁŃÓŚŹŻ]/.test(x))&&parts.length===2&&!/[?]/.test(parts[0])) return parts[0];
    s=s.replace(/(\S+)( \/ \S+)+/g,'$1');
  }
  return s;
}

const CURR=(()=>{
  const out=[];
  [1,2,3].forEach(L=>{
    const cats={}; ITEMS.filter(x=>x.type==='v'&&x.l===L).forEach(x=>(cats[x.cat]=cats[x.cat]||[]).push(x));
    const lists=Object.values(cats), words=[];
    for(let r=0;lists.some(a=>a.length);r++) lists.forEach(a=>{ if(a.length) words.push(a.shift()); });
    const gram=ITEMS.filter(x=>x.type==='g'&&x.l===L);
    let gi=0; words.forEach((w,i)=>{ out.push(w.id); if(i%3===2&&gi<gram.length) out.push(gram[gi++].id); });
    while(gi<gram.length) out.push(gram[gi++].id);

})();

/* ===== PRODUCTION TARGETS FOR WORDS ===== */
function prodTarget(it){
  const p=it.p.replace(/\s*\([^)]*\)/g,'').trim();
  const paren=(it.p.match(/\(([^)]*)\)/)||[])[1];
  if(/ \/ /.test(p)&&!/[?]/.test(p)){
    const parts=p.split(' / ');
    if(parts.every(x=>x.split(' ').length<=2)){
      const fp=it.f.split(' / '), mf=it.f.match(/\s*\((m \/ f(?: \/ n)?)\)/);
      const k=Math.floor(Math.random()*parts.length);
      if(mf) return {prompt:it.f.replace(mf[0],'')+' ('+['m','f','n'][k]+')',ans:[parts[k]]};
      if(fp.length===parts.length) return {prompt:fp[k],ans:[parts[k]]};
      if(parts.length===3) return {prompt:it.f+' ('+['m','f','n'][k]+')',ans:[parts[k]]};
      return {prompt:it.f,ans:parts.concat([p])};
    }
  }
  const s=canon(it.p);
  const ans=[s]; if(paren&&!/\./.test(paren)) ans.push(p+' '+paren);
  if(/ \/ /.test(p)&&p.split(' / ').every(x=>/^[A-ZĄĆĘŁŃÓŚŹŻ]/.test(x))) p.split(' / ').forEach(x=>ans.push(x));

}
/* other cards with the same English meaning count as valid synonyms */
const SYN={}; ITEMS.filter(x=>x.type==='v').forEach(x=>{ const k=x.f.toLowerCase(); (SYN[k]=SYN[k]||[]).push(canon(x.p)); });
const prodKind=it=>/\.\.\./.test(it.p)?'mcq_en_pl':(canon(it.p).split(' ').length>=3?'build':'type');

/* ===== GRAMMAR INSTANCES (a new word every time: varied practice) ===== */
function instFor(it,exclude){
  const k=it.kcd;
  for(let tries=0;tries<6;tries++){
    const x=makeInst(k);
    if(!exclude||x.answer!==exclude) return x;
  }
  return makeInst(k);
}
function makeInst(k){
  if(k.fam==='byc'){ const i=pick(k.persons);
    return {kind:'end',whole:true,parts:[{t:PRON[i]+' ',c:'pron'},{s:BYC[i]}],tiles:BYC.slice(),answer:BYC[i],alts:[BYC[i]],prompt:'być, '+PRON[i],full:PRON[i]+' <b>'+BYC[i]+'</b>',rule:'być is irregular: jestem, jesteś, jest, jesteśmy, jesteście, są.',emap:null}; }

    return {kind:'end',parts:[{t:PRON[i]+' ',c:'pron'},{t:v.stem},{s:e}].concat(v.suf?[{t:v.suf}]:[]),tiles:uniq(G.end.concat(G.dis)),answer:form,alts:[form],
            prompt:v.inf+', '+PRON[i],full:PRON[i]+' '+v.stem+'<b>'+(e||'')+'</b>'+(v.suf||''),rule:G.rule,emap:'verb',paradigm:{v,G}}; }
  if(k.fam==='adj'){ const r=pick(ADJ2.filter(x=>x[4]===k.kc)), form=r[1]+r[2];
    return {kind:'end',parts:[{t:r[1]},{s:r[2]},{t:' '+r[3]}],tiles:['y','i','a','e','ie','ą','ym'],answer:form+' '+r[3],alts:[form+' '+r[3],form],
            prompt:r[0]+' + '+r[3],full:r[1]+'<b>'+r[2]+'</b> '+r[3],rule:ADJ_RULE[k.kc](r[3]),emap:'adj'}; }
  if(k.fam==='ins'){ const r=pick(INS.filter(x=>x[0]===k.kc)), [,pre,lem,as,ae,ns,ne]=r;
    const parts=[{t:pre,c:'pron'}]; if(as) parts.push({t:as},{s:ae},{t:' '}); parts.push({t:ns},{s:ne});
    const phrase=(as?as+ae+' ':'')+ns+ne;
    return {kind:'end',parts,tiles:k.pl?['ymi','imi','ami','ym','im','em','ą','y']:['ym','im','ą','em','iem','','a','ymi'],answer:phrase,alts:[phrase,pre+phrase],
            prompt:pre+'… ('+lem+')',full:pre+(as?as+'<b>'+ae+'</b> ':'')+ns+'<b>'+(ne||'')+'</b>',rule:INS_RULE[k.kc],emap:'ins'}; }
  if(k.fam==='rule'){ const q=pick(Q.filter(x=>x.t===k.topic));
    return {kind:'mcq',q,answer:q.o[q.a],rule:q.w,opts:shuffle(q.o.slice())}; }
}

/* ===== ANSWER CHECKING ===== */
const strip=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l').replace(/Ł/g,'L');
const nrm=s=>String(s).toLowerCase().replace(/[.,!?¿]+/g,'').replace(/\s+/g,' ').trim();
function checkTyped(input,alts){
  const a=nrm(input);
  if(!a) return {level:'empty'};
  for(const x of alts) if(a===nrm(x)) return {level:'ok',target:x};
  for(const x of alts) if(strip(a)===strip(nrm(x))) return {level:'accent',target:x};
  return {level:'wrong',target:alts[0]};
}
function diffHTML(typed,target){          /* LCS alignment: shows the letters you missed */
  const a=[...nrm(typed)], b=[...nrm(target)], n=a.length, m=b.length;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j]=a[i]===b[j]?1+L[i+1][j+1]:Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0,you='',ok='';
  while(i<n&&j<m){ if(a[i]===b[j]){you+=esc(a[i]);ok+=esc(b[j]);i++;j++;} else if(L[i+1][j]>=L[i][j+1]){you+='<s>'+esc(a[i])+'</s>';i++;} else {ok+='<u>'+esc(b[j])+'</u>';j++;} }
  while(i<n){you+='<s>'+esc(a[i])+'</s>';i++;} while(j<m){ok+='<u>'+esc(b[j])+'</u>';j++;}
  return {you,ok};
}

/* ===== SESSION ENGINE ===== */
let SS=null, clockT=null;
const focusOK=it=>ST.settings.focus==='mixed'||(ST.settings.focus==='words'?it.type==='v':it.type==='g');
const dueList=()=>ITEMS.filter(it=>{const c=ST.cards[it.id];return c&&c.due<=today()&&focusOK(it);});
const newLeft=()=>Math.max(0,ST.settings.newPer-dayRec().n);
const nextNew=n=>CURR.filter(id=>!ST.cards[id]&&focusOK(BYID[id])&&(ST.settings.src==='book'||BYID[id].l===ST.settings.src)).slice(0,n);

function buildQueue(extra){
  const t=today(), budget=ST.settings.mins*60, revCost=9, newCost=45;
  let revs = extra
    ? ITEMS.filter(it=>ST.cards[it.id]&&dayIndex(ST.cards[it.id].last)<t&&focusOK(it)).sort((a,b)=>Rnow(ST.cards[a.id])-Rnow(ST.cards[b.id])).slice(0,20)
    : dueList().sort((a,b)=>Rnow(ST.cards[a.id])-Rnow(ST.cards[b.id]));
  revs=revs.slice(0,Math.max(6,Math.floor(budget/revCost)));
  let nNew=extra?0:Math.min(newLeft(),Math.floor(Math.max(0,budget-revs.length*revCost)/newCost));
  if(!extra&&!nNew&&!revs.length) nNew=Math.min(newLeft(),3);
  const news=nextNew(nNew), q=[]; let ri=0,ni=0;
  while(ri<revs.length||ni<news.length){
    for(let k=0;k<2&&ri<revs.length;k++) q.push({id:revs[ri++].id,phase:'review'});
    if(ni<news.length){ const it=BYID[news[ni++]]; q.push({id:it.id,phase:it.type==='v'?'pre':'study'}); }
  }
  return q;
}
function startSession(extra){
  const q=buildQueue(extra);
  if(!q.length){ toast('Nothing to study right now.'); return renderHome(); }
  SS={q,start:now(),limit:ST.settings.mins*60000,done:0,scored:0,right:0,xp:0,newItems:0,reviews:0,lastKind:null,learn:{},errors:[],errIds:[],recent:[],cool:0,extra,run:0};
  clearInterval(clockT); clockT=setInterval(tickClock,1000);
  nextTrial();
}
const inProgress=tr=>['recog','prod','relearn','drill'].includes(tr.phase);
const kindOf=tr=>{const it=BYID[tr.id];return it.type==='v'?'v:'+it.cat:'g:'+it.kcd.fam;};
function enqueue(tr,gap){ SS.q.splice(Math.min(gap,SS.q.length),0,tr); }
function nextTrial(){
  if(now()-SS.start>SS.limit) SS.q=SS.q.filter(inProgress);
  if(!SS.q.length) return finishSession();
  let idx=0;
  if(SS.lastKind&&kindOf(SS.q[0])===SS.lastKind) for(let k=1;k<Math.min(4,SS.q.length);k++) if(kindOf(SS.q[k])!==SS.lastKind){idx=k;break;}
  const tr=SS.q.splice(idx,1)[0];
  SS.lastKind=kindOf(tr); SS.tr=tr; tr.fmt=chooseFmt(tr); tr.t0=now();
  snapshotSession(); save();
  renderTrial(tr);
}
function chooseFmt(tr){
  const it=BYID[tr.id], c=ST.challenge, card=ST.cards[it.id], R=card?Rnow(card):1;
  if(it.type==='v'){
    const recog=()=>(audioOn()&&Math.random()<0.2)?'listen':(Math.random()<0.5?'mcq_pl_en':'mcq_en_pl');
    if(tr.phase==='pre') return 'pre';
    if(tr.phase==='recog') return recog();
    if(tr.phase==='prod') return prodKind(it);
    if(tr.phase==='relearn'||tr.phase==='drill') return c===0?recog():prodKind(it);
    if(c===0) return recog();
    if(c===1) return R<0.8?recog():prodKind(it);
    return Math.random()<0.15?recog():prodKind(it);
  }
  if(tr.phase==='study') return 'study_g';
  if(it.kcd.fam==='rule') return 'mcq_rule';
  if(tr.phase==='recog') return 'tiles';
  if(tr.phase==='prod') return 'type_g';
  if(tr.phase==='relearn'||tr.phase==='drill') return c===0?'tiles':'type_g';
  if(c===0) return 'tiles';
  if(c===1) return R<0.75?'tiles':'type_g';
  return 'type_g';
}
function adapt(){                                  /* keep accuracy near 85% */
  if(SS.cool>0){SS.cool--;return;}
  if(SS.recent.length<8) return;
  const acc=SS.recent.reduce((a,b)=>a+b,0)/SS.recent.length;
  if(acc>0.92&&ST.challenge<2){ST.challenge++;SS.cool=8;SS.recent=[];toast('Going well: questions get harder');}
  else if(acc<0.75&&ST.challenge>0){ST.challenge--;SS.cool=8;SS.recent=[];toast('Easing off a little');}
}
function finalizeNew(id){
  const L=SS.learn[id]; if(!L) return;
  fsrsInit(id,L.err===0?3:L.err===1?2:1,now());
  dayRec().n++; SS.newItems++; delete SS.learn[id];
}
const PRODF=['type','build','type_g'];
function resolve(tr,res){
  const it=BYID[tr.id], t=now(), d=dayRec(), isProd=PRODF.includes(tr.fmt), ok=res.ok;
  tr.resolved=true;
  SS.done++; SS.scored++; d.t++; if(ok){SS.right++;d.c++;SS.run++;} else SS.run=0;
  SS.recent.push(ok?1:0); if(SS.recent.length>20) SS.recent.shift(); adapt();
  let g;
  if(!ok) g=1;
  else if(res.hint||res.sure===false||res.level==='accent'||res.level==='syn') g=2;
  else { const len=res.len||8, slow=res.ms>(isProd?4500+250*len:7000); g=slow?2:3; if(isProd&&!slow&&res.ms<2500+160*len) g=4; }
  if(!isProd&&g===4) g=3;
  let xp=ok?({mcq_pl_en:8,mcq_en_pl:8,listen:10,build:12,type:15,tiles:10,type_g:15,mcq_rule:9}[tr.fmt]||8):2;
  if(tr.phase==='review'){
    const r=fsrsReview(ST.cards[it.id],g,t); d.r++; SS.reviews++;
    if(ok) xp=Math.round(xp*(1+(1-r)));
    else enqueue({id:it.id,phase:'relearn',rep:0,prevAnswer:tr.inst&&tr.inst.answer},4);
  } else if(tr.phase==='drill'){
    xp=Math.round(xp/2);
    if(!ok&&(tr.rep||0)<2) enqueue({id:it.id,phase:'drill',rep:(tr.rep||0)+1,prevAnswer:tr.inst&&tr.inst.answer},3);
  } else if(tr.phase==='relearn'){
    if(!ok&&tr.rep<2) enqueue({id:it.id,phase:'relearn',rep:tr.rep+1,prevAnswer:tr.inst&&tr.inst.answer},3);
  } else if(tr.phase==='recog'){
    const L=SS.learn[it.id];
    const pa=tr.inst&&tr.inst.answer;
    if(ok) enqueue({id:it.id,phase:'prod',prevAnswer:pa},4);
    else { L.err++; if(L.rec<2){L.rec++;enqueue({id:it.id,phase:'recog',prevAnswer:pa},3);} else enqueue({id:it.id,phase:'prod',prevAnswer:pa},4); }
  } else if(tr.phase==='prod'){
    const L=SS.learn[it.id];
    if(ok) finalizeNew(it.id);
    else { L.err++; if(L.prod<3){L.prod++;enqueue({id:it.id,phase:'prod',prevAnswer:tr.inst&&tr.inst.answer},3);} else finalizeNew(it.id); }
  }
  if(ok&&SS.run>0&&SS.run%10===0){ xp+=20; toast('10 in a row: +20'); }
  if(!ok){ SS.errors.push(tr.errLine||''); SS.errIds.push(it.id); }
  SS.xp+=xp; ST.xp+=xp; d.xp+=xp;
  snapshotSession(); save();
  return {xp,confident:!ok&&res.sure===true&&isProd};
}
function finishSession(){
  clearInterval(clockT);
  if(!SS) return renderHome();
  Object.keys(SS.learn).forEach(id=>{ const L=SS.learn[id]; fsrsInit(id,L.err>0?1:2,now()); dayRec().n++; SS.newItems++; });
  SS.learn={};
  const d=dayRec(); d.ms+=now()-SS.start;
  if(SS.done>=5){ const t=today(); if(ST.streak.last!==t){ ST.streak.n=(ST.streak.last===t-1)?ST.streak.n+1:1; ST.streak.last=t; } ST.xp+=30; SS.xp+=30; d.xp+=30; }
  ST.session=null; saveNow(); renderSummary();
}

function distract(it,field,n){
  let pool=ITEMS.filter(x=>x.type==='v'&&x.cat===it.cat&&x[field]!==it[field]);
  if(pool.length<n) pool=pool.concat(ITEMS.filter(x=>x.type==='v'&&x.l===it.l&&x.cat!==it.cat));
  return uniq(shuffle(pool).map(x=>x[field]).filter(v=>v!==it[field])).slice(0,n);
}

      const ok=o===correct; b.classList.add(ok?'right':'wrong'); if(!ok) [...w.children][opts.indexOf(correct)].classList.add('right');

function typeInput(card,tr,alts){

  card.appendChild(inp);

  const go=s=>{ if(!inp.value.trim()){inp.focus();return;} const r=checkTyped(inp.value,alts);
    if(r.level==='wrong'&&tr.tg){ const syn=(SYN[BYID[tr.id].f.toLowerCase()]||[]).filter(x=>!alts.includes(x)); if(syn.some(x=>nrm(x)===nrm(inp.value)||strip(nrm(x))===strip(nrm(inp.value)))) r.level='syn'; }
    [inp,hb,unsure,sure].forEach(x=>x.disabled=true);
    after(tr,{ok:['ok','accent','syn'].includes(r.level),level:r.level,hint:hint>0,sure:s,ms:now()-t0,typed:inp.value,target:r.target||alts[0],len:alts[0].length}); };
  sure.onclick=()=>go(true); unsure.onclick=()=>go(false);

function buildInput(card,tr,target){
  const t0=now(), toks=target.split(' ');

  const out=h('div',{class:'built pl'}), pool=h('div',{class:'pool'}), chosen=[];
  const draw=()=>{ out.innerHTML=chosen.length?'':'<span class="ph">tap the words in order</span>';
    chosen.forEach((ti,k)=>{const b=h('button',{class:'tok on pl',type:'button'},esc(toks[ti])); b.onclick=()=>{chosen.splice(k,1);draw();}; out.appendChild(b);});
    pool.innerHTML=''; order.forEach(ti=>{ if(chosen.includes(ti)) return; const b=h('button',{class:'tok pl',type:'button'},esc(toks[ti])); b.onclick=()=>{chosen.push(ti);draw(); if(chosen.length===toks.length) done();}; pool.appendChild(b); }); };
  const done=()=>{ const typed=chosen.map(i=>toks[i]).join(' '); const ok=typed===target; [...out.children,...pool.children].forEach(x=>x.disabled=true);
    after(tr,{ok,level:ok?'ok':'wrong',sure:true,ms:now()-t0,typed,target,len:target.length/2}); };
  card.appendChild(out); card.appendChild(pool); draw();
}

/* ---- grammar ---- */
function renderGram(tr,it){
  const k=it.kcd;
  if(tr.fmt==='study_g') return studyGram(tr,it);
  const card=frame(tr,PH[tr.phase]+' · '+it.name);
  const x=instFor(it,tr.prevAnswer); tr.inst=x; tr.errLine=x.kind==='mcq'?x.q.q.replace(/\.{3,}/,x.answer):x.full.replace(/<\/?b>/g,'');
  if(x.kind==='mcq'){
    card.appendChild(h('div',{class:'hint'},'Choose the right answer'));
    card.appendChild(h('div',{class:'qtext'+(/\.{4,}/.test(x.q.q)?' pl':'')},esc(x.q.q)));
    mcq(card,x.opts,x.answer,res=>after(tr,res),!/^(masculine|feminine|neuter|plural only|both)$/.test(x.answer));
    return;
  }
  const task={byc:'Present tense of być',verb:'Present tense',adj:'Make the adjective agree (nominative)',ins:k.pl?'Instrumental plural (Kim? Czym?)':'Instrumental (Kim? Czym?)'}[k.fam];
  card.appendChild(h('div',{class:'hint'},task));
  if(tr.fmt==='type_g'){
    card.appendChild(h('div',{class:'big pl'},esc(x.prompt)));
    return typeInput(card,tr,x.alts);
  }
  /* tiles: pick the ending(s) */
  const slots=x.parts.filter(p=>'s' in p).map(p=>p.s), fill=[], t0=now();
  const word=h('div',{class:'gword pl'}), tiles=h('div',{class:'tiles'+(x.whole?' whole':'')});
  const lab=t=>x.whole?t:(t===''?'∅':'-'+t);
  const draw=()=>{ word.innerHTML=''; let si=0;
    x.parts.forEach(p=>{ if('s' in p){ const i=si++, f=fill[i];
      const s=h('span',{class:'slot'+(f!==undefined?' full':'')},f!==undefined?(f===''?'∅':esc(f)):(x.whole?'?':'__'));
      s.onclick=()=>{ if(word.dataset.done) return; fill.length=i; draw(); }; word.appendChild(s);
    } else word.appendChild(h('span',p.c?{class:p.c}:null,esc(p.t).replace(/ /g,'&nbsp;'))); }); };
  shuffle(x.tiles.slice()).forEach(t=>{ const b=h('button',{class:'tile pl',type:'button'},esc(lab(t)));
    b.onclick=()=>{ if(word.dataset.done) return; fill.push(t); draw(); if(fill.length===slots.length){ word.dataset.done=1; [...tiles.children].forEach(z=>z.disabled=true);
      const ok=slots.every((s,i)=>fill[i]===s); after(tr,{ok,level:ok?'ok':'wrong',sure:true,ms:now()-t0,fill:fill.slice(),slots}); } };
    tiles.appendChild(b); });
  card.appendChild(word); card.appendChild(tiles); draw();
}
function studyGram(tr,it){
  const k=it.kcd, card=frame(tr,'New grammar point · lesson '+it.l);
  card.appendChild(h('div',{class:'gname'},esc(it.name)));
  const ex=h('div',{class:'worked'});
  if(k.fam==='rule'){
    ex.appendChild(h('div',{class:'rule'},RULE_SUM[k.topic]));
    const q=pick(Q.filter(z=>z.t===k.topic));
    ex.appendChild(h('div',{class:'wx'},'<div class="wlab">Worked example</div><div class="pl">'+esc(q.q.replace(/\.{3,}/,'['+q.o[q.a]+']'))+'</div><div class="why">'+q.w+'</div>'));
  } else if(k.fam==='verb'||k.fam==='byc'){
    const x=makeInst(k);
    ex.appendChild(h('div',{class:'rule'},x.rule));
    const v=k.fam==='verb'?x.paradigm.v:null;
    const rows=k.persons.map(i=>'<tr><td>'+PRON[i]+'</td><td class="pl">'+(v?v.stem+'<b>'+VG[k.g].end[i]+'</b>'+(v.suf||''):'<b>'+BYC[i]+'</b>')+'</td></tr>').join('');
    ex.appendChild(h('div',{class:'wx'},'<div class="wlab">Worked example'+(v?': '+v.inf:'')+'</div><table>'+rows+'</table>'));
  } else {
    const a=makeInst(k); let b=makeInst(k); for(let n=0;n<5&&b.answer===a.answer;n++) b=makeInst(k);
    ex.appendChild(h('div',{class:'rule'},a.rule));
    ex.appendChild(h('div',{class:'wx'},'<div class="wlab">Worked examples</div><div class="pl">'+a.prompt+' → '+a.full+'</div>'+(b.answer!==a.answer?'<div class="pl">'+b.prompt+' → '+b.full+'</div>':'')));
  }
  card.appendChild(ex);
  card.appendChild(h('div',{class:'cue'},'Read the example, then try one with a different word.'));
  const btn=h('button',{class:'go',type:'button'},'Try it'); card.appendChild(btn); KEYS.next=btn; btn.focus();
  btn.onclick=()=>{ SS.done++; SS.learn[it.id]={err:0,rec:0,prod:0}; enqueue({id:it.id,phase:'recog'},0); nextTrial(); };
}

/* ---- feedback ---- */
function after(tr,res){
  const it=BYID[tr.id], card=$('.trial'), out=resolve(tr,res);
  const fb=h('div',{class:'fb '+(res.ok?(res.level==='ok'?'ok':'meh'):'no'),role:'status','aria-live':'polite'});
  if(!res.ok&&navigator.vibrate){ try{navigator.vibrate(35);}catch(e){} }
  const head=res.ok?(res.level==='accent'?'Correct, but check the accents':res.level==='syn'?'Also correct. This card wanted the word below':'Correct'):(res.level==='empty'?'Skipped':'Not quite');
  fb.appendChild(h('div',{class:'fbh'},head+' <span class="xpc">+'+out.xp+' XP</span>'));
  let sayTxt=null;
  if(it.type==='v'){
    const ansPL=tr.tg?res.target||tr.tg.ans[0]:it.p;
    sayTxt=tr.tg?ansPL:it.say;
    const line=h('div',{class:'fbans pl'},esc(ansPL)); line.appendChild(speakBtn(sayTxt)); fb.appendChild(line);
    fb.appendChild(h('div',{class:'serif fbmean'},esc(it.f)+(it.n?' <span class="note">('+esc(it.n)+')</span>':'')));
  } else if(tr.inst){
    const x=tr.inst;
    if(x.kind==='mcq'){ fb.appendChild(h('div',{class:'fbans pl'},esc(x.answer))); }
    else { fb.appendChild(h('div',{class:'fbans pl'},x.full)); sayTxt=x.full.replace(/<\/?b>/g,'').replace(/[()]/g,'').replace(/ \/ /g,' '); }
  }
  if(res.typed!=null&&res.level!=='ok'&&res.level!=='syn'){ const d=diffHTML(res.typed,res.target||''); fb.appendChild(h('div',{class:'diff pl'},'<div><span>you</span>'+d.you+'</div><div><span>correct</span>'+d.ok+'</div>')); }
  if(res.fill&&!res.ok&&tr.inst&&tr.inst.emap){
    const m=EMAP[tr.inst.emap];
    res.fill.forEach((f,i)=>{ if(f!==res.slots[i]) fb.appendChild(h('div',{class:'contrast'},'You picked <b class="pl">'+(f===''?'∅':'-'+esc(f))+'</b>: that is '+(m[f]||'another form')+'. Needed <b class="pl">'+(res.slots[i]===''?'∅':'-'+esc(res.slots[i]))+'</b>: '+(m[res.slots[i]]||'')+'.')); });
  }
  if(it.type==='g'&&tr.inst) fb.appendChild(h('div',{class:'rule'},tr.inst.rule));
  if(out.confident) fb.appendChild(h('div',{class:'hyper'},'You were sure, and that is good news: confident mistakes are the ones people correct best. It comes back in a minute.'));
  if(!res.ok&&tr.phase!=='review'&&tr.phase!=='relearn') fb.appendChild(h('div',{class:'note'},'It will come back later in this session.'));
  card.appendChild(fb);
  try{ fb.scrollIntoView({behavior:'smooth',block:'nearest'}); }catch(e){}
  if(sayTxt&&(res.ok||it.type==='v')) say(sayTxt);
  const nx=h('button',{class:'go',type:'button'},'Next'); nx.onclick=()=>{ clearTimeout(tr.auto); nextTrial(); }; fb.appendChild(nx); KEYS.next=nx; KEYS.input=null; KEYS.opts=null;
  if(res.ok&&res.level==='ok') tr.auto=setTimeout(()=>{ if(SS&&SS.tr===tr) nextTrial(); }, PRODF.includes(tr.fmt)?1300:800);
  else nx.focus();
}

function strength(L,type){
  const its=ITEMS.filter(x=>x.l===L&&x.type===type), seen=its.filter(x=>ST.cards[x.id]);
  const avg=seen.length?seen.reduce((a,x)=>a+Rnow(ST.cards[x.id]),0)/seen.length:0;
  return {total:its.length,seen:seen.length,avg};
}

function sciencePanel(){
  const d=h('details',{class:'panel sci'});
  d.appendChild(h('summary',null,'Why this works: the research behind each mechanic'));
  const P=[
   ['Retrieval practice','Every trial asks you to recall. Nothing is re-read passively.','Roediger & Karpicke 2006, Psychological Science; Karpicke & Roediger 2008, Science; Yang et al. 2021, Psychological Bulletin (classroom meta-analysis).'],
   ['Spacing with a memory model','Each item has an estimated stability and difficulty. It returns just before you are likely to forget it, at your chosen target recall (FSRS-4.5, default parameters).','Cepeda et al. 2006, Psychological Bulletin; Ye, Su & Cao 2022, KDD (FSRS); Carpenter, Pan & Butler 2022, Nature Reviews Psychology.'],
   ['Successive relearning','New items must be recalled correctly in the session, first by recognition and then by production, and are then relearned across days.','Rawson & Dunlosky 2022, Current Directions in Psychological Science.'],
   ['Pretesting','New words start with a guess before you see the meaning. Wrong guesses still improve later recall.','Kornell, Hays & Bjork 2009, JEP: Learning, Memory, and Cognition; Pan & Carpenter 2023, Educational Psychology Review.'],
   ['Worked examples first','A new grammar point starts with a solved example, then you solve one with a different word.','Sweller, van Merriënboer & Paas 2019, Educational Psychology Review.'],
   ['Interleaving and variation','Item types and categories are mixed, and each grammar point is practised with a new word every time, so you learn the rule and not one form.','Rohrer & Taylor 2007, Instructional Science; Brunmair & Richter 2019, Psychological Bulletin.'],
   ['Desirable difficulty near 85%','The game moves you between recognition and typed production to keep accuracy around 85%, which is where learning per trial peaks in simple models.','Bjork & Bjork 2011; Wilson, Shenhav, Straccia & Cohen 2019, Nature Communications.'],
   ['Production and saying words aloud','Typing the Polish form beats choosing it, and saying it aloud adds a memory trace.','Slamecka & Graf 1978, JEP: Human Learning and Memory; MacLeod et al. 2010, JEP: LMC; Nakata 2011, Computer Assisted Language Learning.'],
   ['No semantic clusters','New words are introduced across categories, not as blocks of related words that interfere with each other.','Tinkham 1993, System; Nation 2000, TESOL Journal.'],
   ['Error feedback and confidence','Errors get the correct form, a diff of your letters, and the rule behind the ending. Confident errors are flagged, since they are corrected best.','Butterfield & Metcalfe 2001, JEP: LMC; Metcalfe 2017, Annual Review of Psychology.'],
   ['Pictures and sound','Words come with a picture and, where your device has a Polish voice, audio.','Paivio 1991 (dual coding).'],
   ['Game elements tied to learning','XP rewards effortful retrieval (more for harder recalls and typed answers) rather than time spent.','Sailer & Homner 2020, Educational Psychology Review.']
  ];
  const w=h('div');
  P.forEach(([t,how,ref])=>w.appendChild(h('div',{class:'prin'},'<b>'+t+'</b><p>'+how+'</p><small>'+ref+'</small>')));
  w.appendChild(h('div',{class:'note'},'References are listed from memory. Check details before citing them.'));
  d.appendChild(w); return d;
}

/* ===== SESSION PERSISTENCE: close the app mid-session and continue later ===== */
const slimTr=tr=>({id:tr.id,phase:tr.phase,rep:tr.rep||0,prevAnswer:tr.prevAnswer});
function snapshotSession(){
  if(!SS){ ST.session=null; return; }
  const q=(SS.tr&&!SS.tr.resolved?[slimTr(SS.tr)]:[]).concat(SS.q.map(slimTr));
  ST.session={day:today(),q,learn:SS.learn,elapsed:now()-SS.start,limit:SS.limit,done:SS.done,scored:SS.scored,right:SS.right,xp:SS.xp,
              newItems:SS.newItems,reviews:SS.reviews,errors:SS.errors,errIds:SS.errIds,recent:SS.recent,cool:SS.cool,extra:SS.extra,run:SS.run};
}
function resumeSession(){
  const s=ST.session; if(!s) return renderHome();
  SS=Object.assign({lastKind:null},s,{start:now()-(s.elapsed||0),q:s.q.slice(),learn:s.learn||{},errors:s.errors||[],errIds:s.errIds||[],recent:s.recent||[]});
  clearInterval(clockT); clockT=setInterval(tickClock,1000);
  nextTrial();
}
function closeStaleSession(){                       /* finish an interrupted session without losing learned items */
  const s=ST.session; if(!s) return;
  Object.keys(s.learn||{}).forEach(id=>{ if(!ST.cards[id]){ fsrsInit(id,(s.learn[id].err||0)>0?1:2,now()); dayRec().n++; } });
  ST.session=null; saveNow();
}
function startDrill(ids){
  SS={q:shuffle(ids.map(id=>({id,phase:'drill',rep:0}))),start:now(),limit:10*60000,done:0,scored:0,right:0,xp:0,newItems:0,reviews:0,lastKind:null,learn:{},errors:[],errIds:[],recent:[],cool:0,extra:'drill',run:0};
  clearInterval(clockT); clockT=setInterval(tickClock,1000);
  nextTrial();
}

/* ===== BROWSE: every word and grammar point with its memory strength ===== */
function browsePanel(){
  const d=h('details',{class:'panel'}); d.appendChild(h('summary',null,'All words and grammar points'));
  let L=0, q='';
  const body=h('div');
  const draw=()=>{
    body.innerHTML='';
    body.appendChild(chipRow('Lesson',[[0,'All'],[1,'1'],[2,'2'],[3,'3']],L,v=>{L=v;draw();}));
    const s=h('input',{class:'search',type:'search',placeholder:'search Polish or English'}); s.value=q;
    s.oninput=()=>{ q=s.value; list(); }; body.appendChild(s);
    const box=h('div',{class:'blist'}); body.appendChild(box);
    const list=()=>{
      const t=nrm(q), st=strip(t);
      const rows=ITEMS.filter(it=>(!L||it.l===L)&&(!t||strip(nrm(it.type==='v'?it.p+' '+it.f:it.name)).includes(st)));
      box.innerHTML='';
      rows.slice(0,400).forEach(it=>{
        const c=ST.cards[it.id], r=c?Rnow(c):null;
        const cls=r==null?'n':r>=0.9?'g':r>=0.75?'y':'r';
        const row=h('button',{class:'brow',type:'button'},
          '<i class="dot '+cls+'"></i><span class="pl">'+esc(it.type==='v'?it.p:it.name)+'</span><span class="serif">'+esc(it.type==='v'?it.f:'grammar')+'</span><span class="bs">'+(r==null?'new':Math.round(r*100)+'%')+'</span>');
        if(it.type==='v') row.onclick=()=>say(it.say);
        box.appendChild(row);
      });
      if(!rows.length) box.appendChild(h('div',{class:'note'},'Nothing matches.'));
    };
    list();
  };
  d.addEventListener('toggle',()=>{ if(d.open&&!body.childNodes.length) draw(); });
  d.appendChild(body);
  d.appendChild(h('div',{class:'note'},'Dots: green is safe, yellow is fading, red is due for rescue, grey is not started. Tap a word to hear it.'));
  return d;
}

/* ===== RUNNING AS AN APP ===== */
const inClaude=()=>HAS_CS||/claude/.test(location.hostname);
const standalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
function installHint(){
  if(inClaude()||!/^https?:/.test(location.protocol)||standalone()) return '';
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  return '<b>Tip:</b> '+(ios?'tap Share, then <b>Add to Home Screen</b>.':'open the browser menu and choose <b>Install app</b> or <b>Add to Home screen</b>.')+' It then opens like an app, works offline, and the browser keeps its data.';
}
if(/^https?:/.test(location.protocol)&&'serviceWorker' in navigator&&!inClaude()){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }

/* save immediately when the phone switches apps or the tab closes */
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ snapshotSession(); saveNow(); } });
window.addEventListener('pagehide',()=>{ snapshotSession(); saveNow(); });

/* ===== BOOT ===== */
(async function(){
  await loadStore(); loadPics();
  if(ST.session&&ST.session.day!==today()) closeStaleSession();
  renderHome();
})();
